<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expense Tracker (Day 4 demo, has bugs on purpose)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;background:#e9eef5;font-family:system-ui,sans-serif;color:#1b2a3a}
.app{width:100%;max-width:480px;margin:0 auto;min-height:100vh;background:#f7fafc;padding:16px 14px 48px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.col{min-width:0}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 4px #0001;margin-bottom:10px;min-width:0}
.total{font-size:30px;font-weight:800;color:#0f9d6e;overflow-wrap:anywhere}.mu{color:#6b7c93;font-size:13px;overflow-wrap:anywhere}
input,select,button{font:inherit;padding:9px;border:1px solid #cdd7e3;border-radius:8px;width:100%;margin-bottom:8px;max-width:100%}
button{background:#0f9d6e;color:#fff;border:0;font-weight:700;cursor:pointer}
button:hover{filter:brightness(0.95)}
button:disabled{opacity:0.5;cursor:not-allowed;filter:none}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 8px}
.list-head h2{margin:0}
.btn-secondary{background:#e2e8f0;color:#1b2a3a;width:auto;padding:8px 14px;margin:0}
.btn-danger{background:#e5484d;color:#fff;width:auto;padding:8px 14px;margin:0}
.btn-add-empty{width:auto;padding:8px 14px;margin:10px 0 0;display:inline-block}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eef2f7}
.row>div:first-child{min-width:0;flex:1;overflow-wrap:anywhere}
.row>div:last-child{display:flex;align-items:center;gap:8px;flex-shrink:0}
.row button{width:auto;background:#e5484d;padding:4px 10px;margin:0}
.bar{height:8px;background:#dfe7f0;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#0f9d6e}
.err{color:#d12a2a;font-size:13px;min-height:16px}
.empty-state{text-align:center;padding:12px 6px}
.dash-empty{margin-top:8px;padding-top:8px;border-top:1px solid #eef2f7}
.budget-box{margin-top:12px;padding-top:12px;border-top:1px solid #eef2f7}
.budget-row{display:flex;gap:8px;align-items:center}
.budget-row input{flex:1;min-width:0;margin-bottom:0}
.budget-row button{width:auto;flex-shrink:0;margin-bottom:0;padding:9px 14px}
.budget-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.budget-ok{color:#0f9d6e;font-weight:600}
.budget-warn{color:#d97706;font-weight:600}
.budget-over{color:#e5484d;font-weight:600}
.skeleton{background:linear-gradient(90deg,#e6edf5 25%,#f2f6fa 50%,#e6edf5 75%);background-size:200% 100%;animation:shimmer 1.1s infinite;border-radius:8px}
.sk-total{height:34px;width:130px;margin-top:4px}
.sk-line{height:16px;width:100%;margin-bottom:10px}
.sk-line.short{width:60%;margin-bottom:0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.toast-wrap{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;width:calc(100vw - 28px);max-width:400px;pointer-events:none}
.toast{background:#1b2a3a;color:#fff;padding:11px 14px;border-radius:10px;box-shadow:0 6px 20px #0003;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;pointer-events:auto}
.toast button{width:auto;margin:0;padding:4px 10px;background:#0f9d6e;font-size:13px}
.modal-backdrop{position:fixed;inset:0;background:#0f172a66;display:none;align-items:center;justify-content:center;padding:16px;z-index:90}
.modal-backdrop.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:340px;box-shadow:0 10px 30px #0004}
.modal h3{margin:0 0 8px;font-size:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
@media(min-width:768px){
  .app{max-width:920px;padding:24px 24px 48px}
  .grid{grid-template-columns:360px 1fr;gap:20px;align-items:start}
}
</style></head><body><div class="app">
<!--
  INSTRUCTOR ANSWER KEY (bugs planted on purpose, same data model + localStorage key as Day 3)
  1 validate(): only checks empty, so 0 and negative amounts save
  2 validate(): category never checked, "Pick category" saves blank
  3 save(): amount stored as a STRING, so the total concatenates (250 + "100" = "250100")
  4 renderList(): delete uses the index of the FILTERED list, so it deletes the wrong row while searching
  5 total labelled "This month" but sums every month
  6 renderReport(): divides by total, so an empty list shows NaN%
  7 search is case-sensitive ("lunch" does not find "Lunch")
  8 load(): JSON.parse has no try/catch, so corrupted localStorage = blank page
-->
<h1>💸 Expense Tracker</h1>
<div class="grid">
<div class="col">
<div class="card"><div class="mu">This month's total</div><div class="total" id="total">₹0</div><div id="dashEmpty"></div>
<div class="budget-box">
  <div class="budget-row">
    <input id="budgetInput" type="number" placeholder="Monthly budget (₹)">
    <button type="button" onclick="saveBudget()">Set</button>
  </div>
  <div class="err" id="budgetErr"></div>
  <div id="budgetStatus"></div>
</div>
</div>

<div class="card"><b>Add expense</b><br><br>
<input id="amt" type="number" placeholder="Amount ₹">
<select id="cat"><option value="">Pick category</option><option>Food</option><option>Transport</option><option>Bills</option><option>Shopping</option></select>
<input id="date" type="date"><input id="note" placeholder="Note (optional)">
<div class="err" id="err"></div><button onclick="save()">Save expense</button></div>
</div>

<div class="col">
<div class="list-head"><h2>Expenses</h2><button type="button" id="exportBtn" class="btn-secondary" onclick="exportCSV()" disabled>Export CSV</button></div>
<input id="q" placeholder="Search note..." oninput="renderList()">
<div class="card" id="list"></div>

<h2>Reports · by category</h2><div class="card" id="rep"></div>
</div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div class="modal-backdrop" id="delModal" role="dialog" aria-modal="true" aria-labelledby="delModalTitle">
  <div class="modal">
    <h3 id="delModalTitle">Delete expense?</h3>
    <div class="mu" id="delModalDesc"></div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" onclick="closeDelModal()">Cancel</button>
      <button type="button" class="btn-danger" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script>
const KEY="expense-tracker-data";
const BUDGET_KEY="expense-tracker-budget";
function load(){
  const raw=localStorage.getItem(KEY);
  if(!raw){const seed=[
    {id:"e_1",amount:250,category:"Food",date:"2026-11-17",note:"Lunch",createdAt:"2026-11-17"},
    {id:"e_2",amount:1200,category:"Bills",date:"2026-11-15",note:"Wi-Fi",createdAt:"2026-11-15"},
    {id:"e_3",amount:90,category:"Transport",date:"2026-11-16",note:"Auto",createdAt:"2026-11-16"},
    {id:"e_4",amount:640,category:"Shopping",date:"2026-10-02",note:"Shoes",createdAt:"2026-10-02"}];
    localStorage.setItem(KEY,JSON.stringify(seed));return seed}
  return JSON.parse(raw);            // BUG 8: no try/catch
}
let expenses=[];
let budget=0;
let pendingDeleteIndex=null;
let lastDeleted=null;
let toastTimer=null;
const persist=()=>localStorage.setItem(KEY,JSON.stringify(expenses));
document.getElementById("date").value=new Date().toISOString().slice(0,10);

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function focusAdd(){
  const el=document.getElementById("amt");
  el.scrollIntoView({behavior:"smooth",block:"center"});
  el.focus();
}
function showToast(msg,undoFn){
  clearTimeout(toastTimer);
  const wrap=document.getElementById("toastWrap");
  wrap.innerHTML=`<div class="toast"><span>${esc(msg)}</span>${undoFn?'<button type="button" id="undoBtn">Undo</button>':""}</div>`;
  if(undoFn){
    document.getElementById("undoBtn").onclick=()=>{
      clearTimeout(toastTimer);
      wrap.innerHTML="";
      undoFn();
    };
  }
  toastTimer=setTimeout(()=>{wrap.innerHTML="";},3000);
}
function showSkeleton(){
  document.getElementById("total").innerHTML='<div class="skeleton sk-total"></div>';
  document.getElementById("dashEmpty").innerHTML="";
  document.getElementById("budgetStatus").innerHTML='<div class="skeleton sk-line short" style="margin-top:6px"></div>';
  document.getElementById("list").innerHTML='<div class="skeleton sk-line"></div><div class="skeleton sk-line"></div><div class="skeleton sk-line short"></div>';
  document.getElementById("rep").innerHTML='<div class="skeleton sk-line"></div><div class="skeleton sk-line short"></div>';
}
function loadBudget(){
  const n=Number(localStorage.getItem(BUDGET_KEY));
  return Number.isFinite(n)&&n>0?n:0;
}
function saveBudget(){
  const raw=document.getElementById("budgetInput").value;
  const val=Number(raw);
  const bErr=document.getElementById("budgetErr");
  if(raw===""||!Number.isFinite(val)||val<=0){
    bErr.textContent="Enter a budget above 0";
    return;
  }
  bErr.textContent="";
  budget=val;
  localStorage.setItem(BUDGET_KEY,String(budget));
  renderBudget();
  showToast("Budget saved");
}
function renderBudget(){
  const box=document.getElementById("budgetStatus");
  if(!budget){
    box.innerHTML='<div class="mu">Set a monthly budget to track your limit.</div>';
    return;
  }
  const spent=expenses.reduce((s,e)=>s+Number(e.amount),0);
  const pct=spent/budget*100;
  const barW=Math.min(100,Math.max(0,pct));
  const color=pct>100?"#e5484d":pct>=80?"#d97706":"#0f9d6e";
  const cls=pct>100?"budget-over":pct>=80?"budget-warn":"budget-ok";
  const diff=Math.round(Math.abs(budget-spent)*100)/100;
  const msg=spent<=budget?`₹${diff} left`:`₹${diff} over budget`;
  box.innerHTML=`<div class="budget-meta"><span class="${cls}">${msg}</span><span class="mu">Budget: ₹${budget} (${Math.round(pct)}%)</span></div><div class="bar"><i style="width:${barW}%;background:${color}"></i></div>`;
}

function validate(a,c){
  if(a==="")return "Enter an amount";
  if(!Number.isFinite(Number(a))||Number(a)<=0)return "Amount must be greater than 0";
  return "";                            // BUG 2: category never checked
}
function save(){
  const a=amt.value,c=cat.value,m=validate(a,c);
  err.textContent=m;if(m)return;
  expenses.push({id:"e_"+Date.now(),amount:a,   // BUG 3: string, not Number(a)
    category:c,date:date.value,note:note.value,createdAt:new Date().toISOString().slice(0,10)});
  persist();amt.value="";note.value="";renderAll();
  showToast("Expense saved");
}
function askDelete(i){
  const item=expenses[i];
  if(!item)return;
  pendingDeleteIndex=i;
  const label=item.note||item.category||"Expense";
  document.getElementById("delModalDesc").textContent=`Remove "${label}" (₹${item.amount})?`;
  document.getElementById("delModal").classList.add("open");
}
function closeDelModal(){
  pendingDeleteIndex=null;
  document.getElementById("delModal").classList.remove("open");
}
function confirmDelete(){
  if(pendingDeleteIndex===null)return;
  const idx=pendingDeleteIndex;
  closeDelModal();
  del(idx);
}
function del(i){
  const removed=expenses.splice(i,1)[0];
  if(!removed)return;
  lastDeleted={item:removed,index:i};
  persist();renderAll();
  showToast("Expense deleted",()=>{
    if(!lastDeleted)return;
    expenses.splice(lastDeleted.index,0,lastDeleted.item);
    lastDeleted=null;
    persist();renderAll();
  });
}
function getExpenses(){return expenses}
function csvCell(v){
  const s=String(v??"");
  return /[",\r\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;
}
function exportCSV(){
  const data=getExpenses();
  if(!data.length)return;
  const header=["date","category","amount","note","paymentMethod"];
  const lines=[header.join(","),...data.map(e=>[e.date,e.category,e.amount,e.note,e.paymentMethod].map(csvCell).join(","))];
  const blob=new Blob([lines.join("\r\n")],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="expenses.csv";
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
}
function renderList(){
  document.getElementById("exportBtn").disabled=getExpenses().length===0;
  const q=document.getElementById("q").value;
  const list=expenses.filter(e=>e.note.includes(q));          // BUG 7: case-sensitive
  document.getElementById("list").innerHTML=list.length?list.map(e=>{
    const idx=expenses.indexOf(e);
    return `<div class="row"><div><b>${esc(e.note||e.category)}</b><div class="mu">${esc(e.category)} · ${esc(e.date)}</div></div>
     <div>₹${esc(e.amount)} <button onclick="askDelete(${idx})">✕</button></div></div>`;
  }).join(""):
    `<div class="empty-state"><div class="mu">${expenses.length?"No expenses match your search.":"No expenses yet. Add your first one to start tracking."}</div><button type="button" class="btn-add-empty" onclick="focusAdd()">+ Add expense</button></div>`;
}
function renderTotal(){
  const t=expenses.reduce((s,e)=>s+e.amount,0);               // BUG 5: all months, not this month
  document.getElementById("total").textContent="₹"+t;
  document.getElementById("dashEmpty").innerHTML=expenses.length?"":
    `<div class="dash-empty"><div class="mu">No expenses recorded yet.</div><button type="button" class="btn-add-empty" onclick="focusAdd()">+ Add expense</button></div>`;
}
function renderReport(){
  const by={};expenses.forEach(e=>by[e.category]=(by[e.category]||0)+Number(e.amount));
  const total=Object.values(by).reduce((a,b)=>a+b,0);
  const keys=Object.keys(by);
  document.getElementById("rep").innerHTML=keys.length?keys.map(k=>{
    const p=Math.round(by[k]/total*100);return `<div style="margin-bottom:10px"><div class="row" style="border:0"><span>${esc(k)}</span><span>₹${by[k]} · ${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("")
  :`<div class="empty-state"><div class="mu">No category data yet. Add an expense to see your breakdown.</div><button type="button" class="btn-add-empty" onclick="focusAdd()">+ Add expense</button></div>`;
}
function renderAll(){renderTotal();renderBudget();renderList();renderReport()}
showSkeleton();
setTimeout(()=>{
  expenses=load();
  budget=loadBudget();
  if(budget)document.getElementById("budgetInput").value=budget;
  renderAll();
},350);
</script></div></body></html>
